# docker compose up -d --build
#   web  -> http://localhost:8081        (React app, Nginx)
#   api  -> http://localhost:8000/docs   (FastAPI)
#   db   -> PostgreSQL, only reachable by the api container
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tj
      POSTGRES_PASSWORD: tj
      POSTGRES_DB: tj
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tj -d tj"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: hackforge-api:latest
    environment:
      DATABASE_URL: postgresql+psycopg://tj:tj@db:5432/tj
      TJ_RESET_ON_START: "true"
      TJ_LAB_RIDERS: "60"
      TJ_CORS_ORIGINS: "*"
      # demo accounts so the Selenium tests can sign in (development only)
      TJ_SEED_DEMO_ACCOUNTS: "true"
      TJ_DEMO_PASSWORD: demo-pass-123
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: hackforge-web:latest
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  pgdata:
